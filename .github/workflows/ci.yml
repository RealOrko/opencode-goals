name: 🧪 CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    name: ✅ Verify plugin
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4
      - name: 🟢 Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: 📦 Install dependencies
        run: npm ci
      - name: 🛠️ Build plugin
        run: npm run build
      - name: 🧪 Run unit tests
        run: npm test
      - name: 🤖 Install OpenCode
        run: npm install --global opencode-ai@1.19.4
      - name: 🔄 Verify real-server lifecycle
        run: npm run test:integration
      - name: 🚢 Check release contents
        run: npm pack --dry-run
